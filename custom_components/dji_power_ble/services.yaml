set_time_periods:
  name: Set electricity price time periods
  description: >-
    Replace all peak and off-peak periods on a Power 2000. Times use the station's
    timezone. This does not change the Energy Optimization mode.
  fields:
    device_id:
      name: Power station
      description: The Power 2000 to update.
      required: true
      selector:
        device:
          filter:
            - integration: dji_power_ble
              model: DJI Power 2000
    periods:
      name: Time periods
      description: >-
        Complete list of periods with type (peak or off_peak), start and end
        (quoted HH:MM), and optional days (mon through sun; omit for every day).
        At most eight periods of each type. An empty list clears the schedule
        only when Scheduled Periods and all grid-tied modes are inactive.
      required: true
      example:
        - type: off_peak
          start: "00:30"
          end: "05:30"
      selector:
        object:
