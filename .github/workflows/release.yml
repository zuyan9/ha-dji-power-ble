name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.3.0, 0.3.0b1, or 0.3.0rc1; optional v prefix)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Require the default branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must be run from the default branch."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: python -m pip install ruff packaging "cryptography>=44.0.0"
      - name: Set the release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          from packaging.version import InvalidVersion, Version

          version = os.environ["VERSION"].removeprefix("v")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:(?:a|b|rc)[0-9]+)?", version):
              raise SystemExit("Use X.Y.Z, X.Y.ZaN, X.Y.ZbN, or X.Y.ZrcN")
          parsed = Version(version)
          if str(parsed) != version:
              raise SystemExit("Version numbers must not contain leading zeros")
          manifest_path = Path("custom_components/dji_power_ble/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          if parsed < Version(manifest["version"]):
              raise SystemExit("The release cannot be older than the current version")
          tags = subprocess.check_output(["git", "tag", "--list"], text=True)
          for tag in tags.splitlines():
              try:
                  previous = Version(tag)
              except InvalidVersion:
                  continue
              if parsed <= previous:
                  raise SystemExit(f"The release must be newer than existing tag {tag}")
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RELEASE_TAG=v{version}\n")
              output.write(f"PRERELEASE={str(parsed.is_prerelease).lower()}\n")
          PY
      - name: Run offline checks
        run: |
          python -m unittest discover -v
          ruff check custom_components tests scripts
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
      - name: HACS
        uses: hacs/action@main
        env:
          REPOSITORY_REF: ${{ github.sha }}
        with:
          category: integration
          comment: "false"
      - name: Commit, tag, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          remote_head=$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "::error::The default branch changed during validation. Run Release again."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dji_power_ble/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $RELEASE_TAG"
          fi
          git tag "$RELEASE_TAG"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG"
          flags=(--latest)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --generate-notes "${flags[@]}"
